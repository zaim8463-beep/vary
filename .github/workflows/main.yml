name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Unzip vary.zip
        run: |
          if [ ! -f vary.zip ]; then
            echo "vary.zip not found in repo root. Files in repo:"
            ls -la
            exit 1
          fi
          mkdir -p project_src
          unzip -o -q vary.zip -d project_src

      - name: Find project folder
        id: proj
        run: |
          F=$(find project_src -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found inside vary.zip. Files:"
            find project_src -maxdepth 3 | head -60
            exit 1
          fi
          echo "Project found in: $(dirname "$F")"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchAssist-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
